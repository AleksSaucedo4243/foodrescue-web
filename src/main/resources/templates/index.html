<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>FoodRescue - Panel de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">FoodRescue | Sistema de Gestión de Alimentos</span>
    </div>
</nav>

<div class="container pb-5">

    <!-- SECCIÓN 1: DONACIONES -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">1. Gestión de Donaciones</div>
        <div class="card-body">
            <form th:action="@{/web/donaciones/guardar}" method="post" class="row g-2 mb-3">
                <div class="col-md-4">
                    <input type="text" name="descripcion" class="form-control" placeholder="Descripción (ej. Manzanas)" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="cantidad" class="form-control" placeholder="Cantidad" required>
                </div>
                <div class="col-md-3">
                    <input type="date" name="fechaVencimiento" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <select name="estado" class="form-select">
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="ENTREGADO">ENTREGADO</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-success w-100">+</button>
                </div>
            </form>

            <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Vencimiento</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${donaciones}">
                    <td th:text="${d.id}"></td>
                    <td th:text="${d.descripcion}"></td>
                    <td th:text="${d.cantidad}"></td>
                    <td th:text="${d.fechaVencimiento}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${d.estado}"></span></td>
                    <td>
                        <a th:href="@{/web/donaciones/eliminar/{id}(id=${d.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN 2: BENEFICIARIOS -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">2. Gestión de Beneficiarios</div>
        <div class="card-body">
            <form th:action="@{/web/beneficiarios/guardar}" method="post" class="row g-2 mb-3">
                <div class="col-md-3">
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre del lugar" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="direccion" class="form-control" placeholder="Dirección" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="telefono" class="form-control" placeholder="Teléfono" required>
                </div>
                <div class="col-md-2">
                    <select name="tipo" class="form-select">
                        <option value="COMEDOR">COMEDOR</option>
                        <option value="ALBERGUE">ALBERGUE</option>
                        <option value="FAMILIA">FAMILIA</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-success w-100">+</button>
                </div>
            </form>

            <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Tipo</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${beneficiarios}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${b.nombre}"></td>
                    <td th:text="${b.direccion}"></td>
                    <td th:text="${b.telefono}"></td>
                    <td><span class="badge bg-warning text-dark" th:text="${b.tipo}"></span></td>
                    <td>
                        <a th:href="@{/web/beneficiarios/eliminar/{id}(id=${b.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN 3: LOTES -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">3. Control de Lotes en Almacén</div>
        <div class="card-body">
            <form th:action="@{/web/lotes/guardar}" method="post" class="row g-2 mb-3">
                <div class="col-md-2">
                    <input type="text" name="codigoLote" class="form-control" placeholder="Código (LOT-02)" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="producto" class="form-control" placeholder="Producto" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="cantidadCajas" class="form-control" placeholder="Cajas" required>
                </div>
                <div class="col-md-2">
                    <input type="date" name="fechaCaducidad" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="ubicacionAlmacen" class="form-control" placeholder="Ubicación" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-success w-100">+</button>
                </div>
            </form>

            <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Producto</th>
                    <th>Cajas</th>
                    <th>Caducidad</th>
                    <th>Ubicación</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${lotes}">
                    <td th:text="${l.id}"></td>
                    <td th:text="${l.codigoLote}"></td>
                    <td th:text="${l.producto}"></td>
                    <td th:text="${l.cantidadCajas}"></td>
                    <td th:text="${l.fechaCaducidad}"></td>
                    <td th:text="${l.ubicacionAlmacen}"></td>
                    <td>
                        <a th:href="@{/web/lotes/eliminar/{id}(id=${l.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
